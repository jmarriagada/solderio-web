name: "SoldeRío Infra Keep-Alive & Health Monitor"

on:
  schedule:
    # Se ejecuta cada 2 días a las 13:00 UTC (10:00 AM hora de Chile)
    # Garantiza actividad frecuente en Supabase para evitar pausas
    - cron: '0 13 */2 * *'

  # Permite ejecutarlo manualmente desde GitHub > Actions > Run workflow
  workflow_dispatch:
    inputs:
      send_email:
        description: '¿Enviar reporte por correo a dev@solderio.cl?'
        required: true
        type: boolean
        default: true

jobs:
  health-check:
    name: "Verificar Servicios y Mantener Supabase Activo"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Ping directo a Supabase PostgREST (Actividad Oficial de Base de Datos)"
        run: |
          echo "Ejecutando consulta directa a la API REST de Supabase..."
          SUPABASE_URL="https://rclpzeiwlkdyvisehymx.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjbHB6ZWl3bGtkeXZpc2VoeW14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTkxMTQsImV4cCI6MjEwMzE5NTExNH0.TjAkFPuZjdE7vbNHYaQGcpmT5td8AST9AwbCyXbwQE0"

          # Consulta directa a PostgREST: Esta es la métrica exacta que Supabase monitorea para pausar
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/User?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" || true)

          echo "Código HTTP recibido de Supabase PostgREST: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "✅ Consulta directa a PostgREST registrada con éxito en Supabase."
          else
            echo "ℹ️ Estado HTTP de Supabase: $HTTP_STATUS (si el proyecto está pausado, debe reactivarse en el dashboard)."
          fi

      - name: "2. Determinar si corresponde envío de correo"
        id: check_email
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SEND_EMAIL=${{ github.event.inputs.send_email }}" >> $GITHUB_OUTPUT
          else
            # En ejecuciones automáticas: se envía correo semanalmente (ej. domingos)
            DAY_OF_WEEK=$(date +%u)
            if [ "$DAY_OF_WEEK" -eq 7 ]; then
              echo "SEND_EMAIL=true" >> $GITHUB_OUTPUT
            else
              echo "SEND_EMAIL=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: "3. Ejecutar Health Check Completo & Despacho de Reporte"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'sol_sec_2026_prod_key' }}
          SEND_EMAIL: ${{ steps.check_email.outputs.SEND_EMAIL }}
        run: |
          echo "Disparando monitor de salud completo..."
          echo "Enviar correo: $SEND_EMAIL"

          URL="https://www.solderio.cl/api/cron/health-check?sendEmail=${SEND_EMAIL}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: GitHub-Actions-SoldeRio-KeepAlive")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Código HTTP recibido: $HTTP_CODE"
          echo "Respuesta:"
          echo "$BODY"
